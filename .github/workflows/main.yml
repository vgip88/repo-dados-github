name: Exemplo Artifact
run-name: Exemplo workflow para artifact, executado por ${{ github.actor }}
on:
  workflow_dispatch:

env: 
  nome-artefato: teste-artefato

jobs:
  upload-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Listagem de arquivos inicial
        run: ls -la

      - name: Gerar alguns arquivos
        run: |
          mkdir artefatos
          echo "Arquivo de teste 01" > ./artefatos/primeiro_arquivo.txt
          echo "Arquivo de teste 02" > ./artefatos/segundo_arquivo.txt
          echo "Arquivo de teste 03" > ./artefatos/terceito_arquivo.txt
          echo "Arquivo de teste 04" > ./artefatos/quarto_arquivo.txt

      - name: Envio dos arquivos
        id: upload-step
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.nome-artefato }}
          path: ./artefatos

      - name: Listagem de arquivo pós-geração
        run: ls -la

      - name: Endereço para obter os artefatos
        run: |
          echo "URL do Artefato: ${{ steps.upload-step.outputs.artifact-url }}"

  download-artifact:
    runs-on: ubuntu-latest
    needs: [upload-artifact]
    steps:
      - name: Listagem de arquivos inicial (vazio)
        run: ls -la

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.nome-artefato }}
          path: ./arquivos_baixados

      - name: Listagem de arquivos após o download
        run: |
          ls -la
          echo "--- Conteúdo do diretório baixado ---"
          ls -la ./arquivos_baixados
